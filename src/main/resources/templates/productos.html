<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar('productos')}"></aside>
        <div class="app-main">
            <header th:replace="~{fragments/layout :: pageHeader('Productos', 'Administra tu inventario, controla las existencias y mantén tus precios actualizados.')}"></header>
            <main class="content">
                <section class="section-block">
                    <div class="section-heading">
                        <div><span class="eyebrow">INVENTARIO</span><h2>Catálogo de productos</h2></div>
                        <div class="catalog-heading-actions">
                            <button th:if="${esAdministrador}" class="button button-primary" type="button"
                                    data-toggle-form="#nuevo-producto" aria-controls="nuevo-producto" aria-expanded="false">
                                Agregar producto <span aria-hidden="true">+</span>
                            </button>
                        </div>
                    </div>
                    <p class="form-feedback form-feedback-error" th:if="${errorProducto}" th:text="${errorProducto}" role="alert"></p>
                    <p class="form-feedback form-feedback-success" th:if="${exitoProducto}" th:text="${exitoProducto}" role="status"></p>
                    <div id="nuevo-producto" class="table-card catalog-add-panel" th:if="${esAdministrador}" hidden>
                        <div class="table-toolbar"><div class="table-title"><strong>Agregar producto</strong><small>Completa la información del inventario.</small></div></div>
                        <form class="catalog-form" th:action="@{/web/productos}" th:object="${nuevoProducto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <label>Nombre<input th:field="*{nombre}" type="text" maxlength="120" required></label>
                            <label>Categoría<select th:field="*{categoria}" required>
                                <option value="" disabled>Selecciona una categoría</option>
                                <option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria}"></option>
                            </select></label>
                            <label>Marca<input th:field="*{marca}" type="text" maxlength="80" required></label>
                            <label>Precio<input th:field="*{precio}" type="number" min="0.01" step="0.01" required></label>
                            <label>Cantidad<input th:field="*{cantidad}" type="number" min="0" step="1" required></label>
                            <button class="button button-primary catalog-submit" type="submit">Guardar producto</button>
                        </form>
                    </div>
                    <div class="table-card">
                        <div class="table-toolbar">
                            <div class="table-title"><strong>Productos disponibles</strong><small>Revisa categorías, precios y existencias.</small></div>
                            <input class="table-search" type="search" placeholder="Buscar producto..." aria-label="Buscar productos" data-table-filter="#tabla-productos">
                        </div>
                        <div class="table-scroll">
                            <table id="tabla-productos">
                                <thead><tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Marca</th><th>Precio</th><th>Cantidad</th><th th:if="${esAdministrador}">Acciones</th></tr></thead>
                                <tbody>
                                    <th:block th:each="producto : ${productos}">
                                    <tr data-search-row>
                                        <td class="table-id" th:text="${producto.idProducto}"></td>
                                        <td><strong th:text="${producto.nombre}"></strong></td>
                                        <td th:text="${producto.categoria}"></td>
                                        <td th:text="${producto.marca}"></td>
                                        <td th:text="${'$ ' + #numbers.formatDecimal(producto.precio, 1, 2)}"></td>
                                        <td th:text="${producto.cantidad}"></td>
                                        <td th:if="${esAdministrador}">
                                            <div class="user-actions">
                                                <button class="table-link" type="button"
                                                        th:attr="data-toggle-form=|#editar-producto-${producto.idProducto}|, aria-controls=|editar-producto-${producto.idProducto}|"
                                                        aria-expanded="false">Editar</button>
                                                <form th:action="@{/web/productos/{id}/eliminar(id=${producto.idProducto})}"
                                                      method="post" data-confirm-delete
                                                      data-confirm-message="¿Eliminar este producto? No se podrá eliminar si tiene compras o ventas registradas.">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                    <button class="table-danger" type="submit">Eliminar</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${esAdministrador}" class="catalog-edit-row" th:id="'editar-producto-' + ${producto.idProducto}" hidden>
                                        <td colspan="7">
                                            <form class="catalog-form" th:action="@{/web/productos/{id}/editar(id=${producto.idProducto})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <label>Nombre<input name="nombre" th:value="${producto.nombre}" type="text" maxlength="120" required></label>
                                                <label>Categoría<select name="categoria" required>
                                                    <option th:each="categoria : ${categorias}" th:value="${categoria}"
                                                            th:text="${categoria}" th:selected="${categoria == producto.categoria}"></option>
                                                </select></label>
                                                <label>Marca<input name="marca" th:value="${producto.marca}" type="text" maxlength="80" required></label>
                                                <label>Precio<input name="precio" th:value="${producto.precio}" type="number" min="0.01" step="0.01" required></label>
                                                <label>Cantidad<input name="cantidad" th:value="${producto.cantidad}" type="number" min="0" step="1" required></label>
                                                <button class="button button-primary catalog-submit" type="submit">Guardar cambios</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </th:block>
                                    <tr th:if="${#lists.isEmpty(productos)}"><td class="empty-state" th:attr="colspan=${esAdministrador ? 7 : 6}">Aún no hay productos registrados.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
                <footer class="page-footer">Tienda de Barrio <span>·</span> Productos</footer>
            </main>
        </div>
    </div>
    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
