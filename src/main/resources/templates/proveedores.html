<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar('proveedores')}"></aside>
        <div class="app-main">
            <header th:replace="~{fragments/layout :: pageHeader('Proveedores', 'Tus aliados para que nunca falte lo importante.')}"></header>
            <main class="content">
                <section class="section-block">
                    <div class="section-heading">
                        <div><span class="eyebrow">ALIADOS DEL NEGOCIO</span><h2>Directorio de proveedores</h2></div>
                        <div class="catalog-heading-actions">
                            <span class="list-count" th:text="${#lists.size(proveedores)} + ' registros'">0 registros</span>
                            <button th:if="${esAdministrador}" class="button button-primary" type="button"
                                    data-toggle-form="#nuevo-proveedor" aria-controls="nuevo-proveedor" aria-expanded="false">
                                Agregar proveedor <span aria-hidden="true">+</span>
                            </button>
                        </div>
                    </div>
                    <p class="form-feedback form-feedback-error" th:if="${errorProveedor}" th:text="${errorProveedor}" role="alert"></p>
                    <p class="form-feedback form-feedback-success" th:if="${exitoProveedor}" th:text="${exitoProveedor}" role="status"></p>
                    <div id="nuevo-proveedor" class="table-card catalog-add-panel" th:if="${esAdministrador}" hidden>
                        <div class="table-toolbar"><div class="table-title"><strong>Agregar proveedor</strong><small>Registra sus datos de contacto.</small></div></div>
                        <form class="catalog-form" th:action="@{/web/proveedores}" th:object="${nuevoProveedor}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <label>Nombre<input th:field="*{nombre}" type="text" maxlength="120" required></label>
                            <label>Teléfono<input th:field="*{telefono}" type="tel" minlength="8" maxlength="30" required></label>
                            <label>Dirección<input th:field="*{direccion}" type="text" maxlength="255" required></label>
                            <button class="button button-primary catalog-submit" type="submit">Guardar proveedor</button>
                        </form>
                    </div>
                    <div class="table-card">
                        <div class="table-toolbar">
                            <div class="table-title"><strong>Proveedores registrados</strong><small>Encuentra sus datos de contacto.</small></div>
                            <input class="table-search" type="search" placeholder="Buscar proveedor..." aria-label="Buscar proveedores" data-table-filter="#tabla-proveedores">
                        </div>
                        <div class="table-scroll">
                            <table id="tabla-proveedores">
                                <thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th th:if="${esAdministrador}">Acciones</th></tr></thead>
                                <tbody>
                                    <th:block th:each="proveedor : ${proveedores}">
                                    <tr data-search-row>
                                        <td class="table-id" th:text="${proveedor.idProveedor}"></td>
                                        <td><strong th:text="${proveedor.nombre}"></strong></td>
                                        <td th:text="${proveedor.telefono}"></td>
                                        <td th:text="${proveedor.direccion}"></td>
                                        <td th:if="${esAdministrador}">
                                            <div class="user-actions">
                                                <button class="table-link" type="button"
                                                        th:attr="data-toggle-form=|#editar-proveedor-${proveedor.idProveedor}|, aria-controls=|editar-proveedor-${proveedor.idProveedor}|"
                                                        aria-expanded="false">Editar</button>
                                                <form th:action="@{/web/proveedores/{id}/eliminar(id=${proveedor.idProveedor})}"
                                                      method="post" data-confirm-delete
                                                      data-confirm-message="¿Eliminar este proveedor? No se podrá eliminar si tiene compras registradas.">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                    <button class="table-danger" type="submit">Eliminar</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${esAdministrador}" class="catalog-edit-row" th:id="'editar-proveedor-' + ${proveedor.idProveedor}" hidden>
                                        <td colspan="5">
                                            <form class="catalog-form" th:action="@{/web/proveedores/{id}/editar(id=${proveedor.idProveedor})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <label>Nombre<input name="nombre" th:value="${proveedor.nombre}" type="text" maxlength="120" required></label>
                                                <label>Teléfono<input name="telefono" th:value="${proveedor.telefono}" type="tel" minlength="8" maxlength="30" required></label>
                                                <label>Dirección<input name="direccion" th:value="${proveedor.direccion}" type="text" maxlength="255" required></label>
                                                <button class="button button-primary catalog-submit" type="submit">Guardar cambios</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </th:block>
                                    <tr th:if="${#lists.isEmpty(proveedores)}"><td class="empty-state" th:attr="colspan=${esAdministrador ? 5 : 4}">Aún no hay proveedores registrados.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
                <footer class="page-footer">Tienda de Barrio <span>·</span> Proveedores</footer>
            </main>
        </div>
    </div>
    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
