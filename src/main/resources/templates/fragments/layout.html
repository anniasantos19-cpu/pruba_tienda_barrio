<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e7">
    <title th:text="${pageTitle} + ' | Tienda de Barrio'">Tienda de Barrio</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <aside class="sidebar" th:fragment="sidebar(activePage)">
        <a class="brand" th:href="@{/}" aria-label="Ir al inicio">
            <img class="brand-logo" th:src="@{/images/logotipo.png}" alt="Tienda de Barrio">
            <span class="brand-copy"><strong>Tienda de Barrio</strong><small>ADMINISTRACIÓN</small></span>
        </a>
        <div class="nav-caption">MENÚ PRINCIPAL</div>
        <nav class="main-nav" aria-label="Navegación principal">
            <a th:href="@{/}" th:classappend="${activePage == 'inicio'} ? 'active' : ''"><span class="nav-symbol">⌂</span>Inicio</a>
            <a th:href="@{/web/productos}" th:classappend="${activePage == 'productos'} ? 'active' : ''"><span class="nav-symbol">▦</span>Productos</a>
            <a th:href="@{/web/ventas}" th:classappend="${activePage == 'ventas'} ? 'active' : ''"><span class="nav-symbol">↗</span>Ventas</a>
            <a th:href="@{/web/compras}" th:classappend="${activePage == 'compras'} ? 'active' : ''"><span class="nav-symbol">↙</span>Compras</a>
            <a th:href="@{/web/clientes}" th:classappend="${activePage == 'clientes'} ? 'active' : ''"><span class="nav-symbol">♧</span>Clientes</a>
            <a th:href="@{/web/proveedores}" th:classappend="${activePage == 'proveedores'} ? 'active' : ''"><span class="nav-symbol">◇</span>Proveedores</a>
            <a th:if="${esAdministrador}" th:href="@{/web/usuarios}" th:classappend="${activePage == 'usuarios'} ? 'active' : ''"><span class="nav-symbol">♙</span>Usuarios y roles</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="sidebar-note"><span class="status-dot"></span><span>Tu tienda, creciendo<br><small>paso a paso</small></span></div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="logout-button" type="submit"><span class="nav-symbol">↪</span>Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <header class="topbar" th:fragment="pageHeader(pageTitle, pageDescription)">
        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" data-menu-toggle>☰</button>
        <div class="topbar-heading">
            <span class="breadcrumb">TIENDA DE BARRIO <span>/</span> <b th:text="${pageTitle}">Inicio</b></span>
            <h1 th:text="${pageTitle}">Inicio</h1>
            <p th:text="${pageDescription}">Administra tu negocio.</p>
        </div>
        <div class="account-chip">
            <span class="account-avatar" th:text="${#strings.substring(correoSesion, 0, 1).toUpperCase()}">U</span>
            <span class="account-info"><strong th:text="${correoSesion}">usuario</strong><small th:text="${esAdministrador ? 'Administrador' : 'Equipo'}">Equipo</small></span>
        </div>
    </header>
</body>
</html>
