<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>
        <div class="app-main">
            <header th:replace="~{fragments/layout :: pageHeader('Clientes', 'La información de las personas que hacen crecer tu negocio.')}"></header>
            <main class="content">
                <section class="section-block">
                    <div class="section-heading">
                        <div><span class="eyebrow">RELACIONES DE CONFIANZA</span><h2>Directorio de clientes</h2></div>
                        <div class="catalog-heading-actions">
                            <span class="list-count" th:text="${#lists.size(clientes)} + ' registros'">0 registros</span>
                            <button class="button button-primary" type="button"
                                    data-toggle-form="#nuevo-cliente" aria-controls="nuevo-cliente" aria-expanded="false">
                                Agregar cliente <span aria-hidden="true">+</span>
                            </button>
                        </div>
                    </div>
                    <p class="form-feedback form-feedback-error" th:if="${errorCliente}" th:text="${errorCliente}" role="alert"></p>
                    <p class="form-feedback form-feedback-success" th:if="${exitoCliente}" th:text="${exitoCliente}" role="status"></p>
                    <div id="nuevo-cliente" class="table-card catalog-add-panel" hidden>
                        <div class="table-toolbar"><div class="table-title"><strong>Agregar cliente</strong><small>Registra sus datos de contacto.</small></div></div>
                        <form class="catalog-form" th:action="@{/web/clientes}" th:object="${nuevoCliente}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <label>Nombre<input th:field="*{nombre}" type="text" maxlength="120" required></label>
                            <label>Teléfono<input th:field="*{telefono}" type="tel" minlength="8" maxlength="30" required></label>
                            <label>Dirección<input th:field="*{direccion}" type="text" maxlength="255" required></label>
                            <button class="button button-primary catalog-submit" type="submit">Guardar cliente</button>
                        </form>
                    </div>
                    <div class="table-card">
                        <div class="table-toolbar">
                            <div class="table-title"><strong>Clientes registrados</strong><small>Consulta sus datos de contacto.</small></div>
                            <input class="table-search" type="search" placeholder="Buscar cliente..." aria-label="Buscar clientes" data-table-filter="#tabla-clientes">
                        </div>
                        <div class="table-scroll">
                            <table id="tabla-clientes">
                                <thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th th:if="${esAdministrador}">Acciones</th></tr></thead>
                                <tbody>
                                    <th:block th:each="cliente : ${clientes}">
                                    <tr data-search-row>
                                        <td class="table-id" th:text="${cliente.idCliente}"></td>
                                        <td><strong th:text="${cliente.nombre}"></strong></td>
                                        <td th:text="${cliente.telefono}"></td>
                                        <td th:text="${cliente.direccion}"></td>
                                        <td th:if="${esAdministrador}"><button class="table-link" type="button"
                                            th:attr="data-toggle-form=|#editar-cliente-${cliente.idCliente}|, aria-controls=|editar-cliente-${cliente.idCliente}|"
                                            aria-expanded="false">Editar</button></td>
                                    </tr>
                                    <tr th:if="${esAdministrador}" class="catalog-edit-row" th:id="'editar-cliente-' + ${cliente.idCliente}" hidden>
                                        <td colspan="5">
                                            <form class="catalog-form" th:action="@{/web/clientes/{id}/editar(id=${cliente.idCliente})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <label>Nombre<input name="nombre" th:value="${cliente.nombre}" type="text" maxlength="120" required></label>
                                                <label>Teléfono<input name="telefono" th:value="${cliente.telefono}" type="tel" minlength="8" maxlength="30" required></label>
                                                <label>Dirección<input name="direccion" th:value="${cliente.direccion}" type="text" maxlength="255" required></label>
                                                <button class="button button-primary catalog-submit" type="submit">Guardar cambios</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </th:block>
                                    <tr th:if="${#lists.isEmpty(clientes)}"><td class="empty-state" colspan="5">Aún no hay clientes registrados.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
                <footer class="page-footer">Tienda de Barrio <span>·</span> Clientes</footer>
            </main>
        </div>
    </div>
    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
